<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#c91a09">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brick Kart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="hud" class="hidden"></div>
<div id="touch" class="hidden"></div>
<div id="flash"></div>
<div id="ui"></div>
<div id="toasts"></div>
<div id="loading">
  <div class="load-inner">
    <div class="spinner"><i></i><i></i><i></i></div>
    <div id="load-text">Loading bricks…</div>
  </div>
</div>
<noscript><p class="noscript">Brick Kart needs JavaScript and a WebGL-capable browser.</p></noscript>
<script type="module" src="./js/main.js"></script>
</body>
</html>
