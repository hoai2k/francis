<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jujutsu Craft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>Jujutsu Craft</h1>
  <div id="stage">
    <canvas id="c" aria-label="Minecraft-style Jujutsu Kaisen animation"></canvas>
    <div id="overlay">
      <button id="bigPlay" class="mc-btn big">▶ PLAY</button>
      <p id="hint">30 second fan animation · sound on 🔊</p>
    </div>
  </div>
  <div id="controls">
    <button id="play" class="mc-btn" aria-label="Play or pause">▶</button>
    <input id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="Timeline">
    <span id="time">0.0s</span>
    <button id="mute" class="mc-btn" aria-label="Toggle sound">🔊</button>
    <button id="fs" class="mc-btn" aria-label="Fullscreen">⛶</button>
  </div>
  <p class="keys">Space play/pause · ←/→ seek · R restart · M mute · F fullscreen</p>
</main>
<script src="./anim.js"></script>
</body>
</html>
