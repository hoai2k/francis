# Terra Realis Shaders - OptiFine / Iris configuration

oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=fancy
dynamicHandLight=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true

# colortex1 carries normals + material flags; never blend it.
blend.gbuffers_water.colortex1=off
blend.gbuffers_hand_water.colortex1=off

screen=<profile> <empty> [SHADOWS] [MATERIALS] [WATER] [ATMOSPHERE] [CAMERA]
screen.SHADOWS=shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation ambientOcclusionLevel
screen.MATERIALS=PBR_NORMALS PBR_SPECULAR RAIN_PUDDLES <empty> WAVING_PLANTS WAVING_LEAVES WAVE_SPEED
screen.WATER=WATER_WAVES WATER_WAVE_HEIGHT WATER_ALPHA REFLECTIONS
screen.ATMOSPHERE=GODRAYS GODRAY_STRENGTH FOG_DENSITY SUN_BRIGHTNESS TORCH_BRIGHTNESS
screen.CAMERA=BLOOM BLOOM_STRENGTH EXPOSURE SATURATION VIGNETTE

sliders=shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation ambientOcclusionLevel WAVE_SPEED \
  WATER_WAVE_HEIGHT WATER_ALPHA GODRAY_STRENGTH FOG_DENSITY SUN_BRIGHTNESS TORCH_BRIGHTNESS BLOOM_STRENGTH \
  EXPOSURE SATURATION VIGNETTE

profile.LOW=shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SOFTNESS=1.0 !REFLECTIONS !GODRAYS !BLOOM
profile.MEDIUM=shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SOFTNESS=1.0 REFLECTIONS GODRAYS BLOOM
profile.HIGH=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SOFTNESS=1.0 REFLECTIONS GODRAYS BLOOM
profile.ULTRA=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SOFTNESS=1.5 REFLECTIONS GODRAYS BLOOM
