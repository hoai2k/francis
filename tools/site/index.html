<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Francis Studio</title>
  <meta name="description" content="Blocky anime fights and games, drawn and scored live in pure JavaScript.">
  <meta name="theme-color" content="#07060d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap&text=%E4%B8%8A%E6%98%A0%E4%B8%AD%E5%85%A8%E8%A9%B1%E5%91%AA%E8%A1%93%E5%8B%95%E7%94%BB%E5%B7%A5%E6%88%BF" rel="stylesheet">
  <link rel="stylesheet" href="./_home/home.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="scan" aria-hidden="true"></div>
  <header class="top">
    <a class="logo" href="./"><i></i>FRANCIS STUDIO</a>
    <nav><a href="#episodes">EPISODES ▾</a></nav>
  </header>
  <main>
    <section class="hero">
      <p class="kicker">BLOCK ANIME · DRAWN LIVE IN PURE JAVASCRIPT</p>
      <h1 class="glitch big" data-text="FRANCIS">FRANCIS</h1><br>
      <span class="glitch sub" data-text="STUDIO">STUDIO</span>
      <span class="jp">呪術動画工房</span>
      <ul class="stats">{{STATS}}</ul>
    </section>
    <div class="ticker" aria-hidden="true"><div>{{TICKER}}</div></div>
    {{FEATURED}}
    <section id="episodes">
      <h2 class="section-title"><span>ALL EPISODES</span><span class="jp">全話</span></h2>
      <div class="grid">
{{CARDS}}
      </div>
    </section>
  </main>
  <footer>
    every frame and sound is generated by code: no video files, no sprites<br>
    <b>FRANCIS STUDIO</b> · fan animations &amp; games
  </footer>
  <script src="./_home/home.js"></script>
</body>
</html>
