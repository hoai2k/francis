<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuji &amp; Todo vs Sukuna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap&text=%21%E3%81%A4%E3%82%92%E3%83%91%E3%83%B3%E4%B8%8D%E4%B8%96%E4%B8%A1%E4%BB%81%E5%84%BA%E5%A0%82%E5%AE%BF%E6%82%A0%E6%88%AF%E6%8D%8C%E6%92%83%E6%96%AC%E6%96%AD%E6%9D%96%E6%9D%B1%E7%95%8C%E7%BE%A9%E8%91%B5%E8%99%8E%E9%81%8A%E9%96%83%E9%96%8B%E9%9D%A2%E9%BB%92" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>Yuji &amp; Todo vs Sukuna</h1>
  <div id="stage">
    <canvas id="c" aria-label="Minecraft-style Yuji &amp; Todo vs Sukuna fight animation"></canvas>
    <div id="overlay">
      <button id="bigPlay" class="mc-btn big">▶ PLAY</button>
      <p id="hint">2 minute fan animation, Boogie Woogie trickshots · turn your sound up 🔊</p>
    </div>
  </div>
  <div id="controls">
    <button id="play" class="mc-btn" aria-label="Play or pause">▶</button>
    <input id="scrub" type="range" min="0" max="120" step="0.01" value="0" aria-label="Timeline">
    <span id="time">0:00</span>
    <button id="mute" class="mc-btn" aria-label="Toggle sound">🔊</button>
    <button id="fs" class="mc-btn" aria-label="Fullscreen">⛶</button>
  </div>
  <p class="keys">Space play/pause · ←/→ seek · R restart · M mute · F fullscreen</p>
</main>
<script src="./js/core.js"></script>
<script src="./js/models.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/heroes.js"></script>
<script src="./js/shots.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
