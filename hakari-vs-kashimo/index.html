<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hakari vs Kashimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap&text=%21%E3%81%9F%E3%82%8A%E3%83%81%E3%83%A3%E3%83%AA%E3%83%B3%E3%83%BC%E4%B8%80%E5%88%97%E5%8D%9A%E5%9D%90%E5%9F%9F%E5%A4%A7%E5%B1%95%E5%BD%93%E5%BE%92%E6%84%9B%E6%AC%A1%E6%AE%BA%E7%A7%81%E7%A7%A4%E7%B4%94%E7%B4%AB%E8%BB%8A%E9%80%A3%E9%87%91%E9%89%84%E9%96%8B%E9%9B%B2%E9%9B%B7%E9%A0%98%E9%B9%BF" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>Hakari vs Kashimo</h1>
  <div id="stage">
    <canvas id="c" aria-label="Minecraft-style Hakari vs Kashimo fight animation"></canvas>
    <div id="overlay">
      <button id="bigPlay" class="mc-btn big">▶ PLAY</button>
      <p id="hint">2 minute manga-accurate fan animation · turn your sound up 🔊</p>
    </div>
  </div>
  <div id="controls">
    <button id="play" class="mc-btn" aria-label="Play or pause">▶</button>
    <input id="scrub" type="range" min="0" max="120" step="0.01" value="0" aria-label="Timeline">
    <span id="time">0:00</span>
    <button id="mute" class="mc-btn" aria-label="Toggle sound">🔊</button>
    <button id="fs" class="mc-btn" aria-label="Fullscreen">⛶</button>
  </div>
  <p class="keys">Space play/pause · ←/→ seek · R restart · M mute · F fullscreen</p>
</main>
<script src="./js/core.js"></script>
<script src="./js/models.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/shots.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
